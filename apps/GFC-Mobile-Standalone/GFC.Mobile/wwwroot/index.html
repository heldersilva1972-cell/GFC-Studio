<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GFC Mobile | GFC</title>
    <base href="/" />
    
    <!-- SYSTEM FONTS AND ASSETS (NO GUESSING) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- CORE CSS (MATCHING ORIGINAL PRODUCTION) -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/god-tier-animations.css" />
    <link rel="stylesheet" href="css/mobile-modern.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="GFC.Mobile.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f1f5f9" />

    <style>
        :root {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent-primary: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        body { background-color: var(--bg-primary); margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        .gfc-loader-container {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; background-color: #f1f5f9; color: #2563eb;
        }
        .gfc-logo-pulse {
            width: 120px; height: 120px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            border-radius: 30px; display: flex; justify-content: center; align-items: center;
            font-size: 3rem; font-weight: 800; color: white;
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.4);
            animation: gfc-pulse 2s infinite ease-in-out;
            margin-bottom: 24px; font-family: 'Outfit', sans-serif;
        }
        @keyframes gfc-pulse {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(37, 99, 235, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(124, 58, 237, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 30px rgba(37, 99, 235, 0.4); }
        }
        .loading-text { letter-spacing: 0.2rem; text-transform: uppercase; font-size: 0.8rem; font-weight: 800; color: #64748b; opacity: 0.8; }
    </style>
</head>

<body>
    <div id="app">
        <div class="gfc-loader-container">
            <div class="gfc-logo-pulse">GFC</div>
            <div class="loading-text">Initializing Secure Tunnel</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
