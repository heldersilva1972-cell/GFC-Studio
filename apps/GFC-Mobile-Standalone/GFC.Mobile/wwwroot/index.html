<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GFC Mobile Hub</title>
    <base href="./" />
    
    <script>
        // [CRITICAL] Global Error Monitor - Must be first to catch early boot failures
        window.onerror = function(msg, url, line, col, error) {
            const msgBox = document.getElementById('loader-msg');
            if (msgBox) {
                msgBox.innerHTML = '<span style="color: #ef4444; font-weight: bold;">Boot Error: ' + msg + '</span><br><small style="color: #94a3b8; font-size: 0.6rem;">' + url.split('/').pop() + ':' + line + '</small>';
            }
            console.error("[GFC BOOT ERROR]", {msg, url, line, col, error});
            return false;
        };
    </script>

    <!-- SYSTEM FONTS AND ASSETS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- CORE CSS -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/god-tier-animations.css" />
    <link rel="stylesheet" href="css/mobile-modern.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="GFC.Mobile.styles.css" rel="stylesheet" />
    
    <link rel="apple-touch-icon" sizes="512x512" href="gfc-mobile-v5-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="gfc-mobile-v5-192.png" />
    <link rel="icon" type="image/png" href="gfc-favicon-v5.png" />
    
    <meta name="apple-mobile-web-app-title" content="GFC Mobile" />
    <meta name="application-name" content="GFC Mobile" />
    <meta name="msapplication-TileImage" content="gfc-mobile-v5-512.png" />
    <meta name="msapplication-TileColor" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f1f5f9" />

    <!-- Cache-Bust Manifest -->
    <link href="manifest.json?v=92" rel="manifest" />

    <style>
        :root {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent-primary: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        body { background-color: var(--bg-primary); margin: 0; padding: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        .gfc-loader-container {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; background-color: #f1f5f9; color: #4f46e5;
            transition: opacity 0.5s ease;
        }
        .mobile-label {
            position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
            font-size: 0.85rem; font-weight: 900; color: #4f46e5;
            text-transform: uppercase; letter-spacing: 0.2rem; opacity: 0.9;
        }
        .gfc-logo-pulse {
            position: relative; width: 120px; height: 120px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 32px; display: flex; justify-content: center; align-items: center;
            font-size: 3.2rem; font-weight: 900; color: white;
            box-shadow: 0 10px 40px rgba(79, 70, 229, 0.4);
            animation: gfc-pulse 2.2s infinite ease-in-out;
            margin-bottom: 40px; font-family: 'Outfit', sans-serif;
        }
        @keyframes gfc-pulse {
            0% { transform: scale(1); box-shadow: 0 10px 40px rgba(79, 70, 229, 0.4); }
            50% { transform: scale(1.04); box-shadow: 0 15px 60px rgba(124, 58, 237, 0.6); }
            100% { transform: scale(1); box-shadow: 0 10px 40px rgba(79, 70, 229, 0.4); }
        }
        .loading-text { letter-spacing: 0.2rem; text-transform: uppercase; font-size: 0.8rem; font-weight: 800; color: #64748b; opacity: 0.8; text-align: center; padding: 0 20px; }
        
        #loading-timeout-action {
            display: none; margin-top: 20px; text-align: center; animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .diag-btn {
            background: white; border: 1px solid #e2e8f0; color: #475569;
            padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
            cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="gfc-loader-container" id="gfc-loader">
            <div class="gfc-logo-pulse">
                GFC
                <span class="mobile-label">Mobile</span>
            </div>
            <div class="loading-text" id="loader-msg">Establishing Secure Connection</div>
            
            <div id="loading-timeout-action">
                <p style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 12px;">Connecting to secure gateway...</p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <a href="." class="diag-btn"><i class="bi bi-arrow-clockwise"></i> Retry</a>
                    <a href="/pwa-diagnostic.html" class="diag-btn"><i class="bi bi-search"></i> Diagnostics</a>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <!-- SYSTEM SCRIPTS -->
    <script src="js/connectivity.js?v=92"></script>
    <script src="js/pwa-installer.js?v=92"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    
    <script>
        // PWA Early Capture
        window._pwaBeforeInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window._pwaBeforeInstallPrompt = e;
            console.log("[GFC PWA] Install prompt captured early");
        });

        // Loading Timeout Monitor
        setTimeout(() => {
            const timeoutAction = document.getElementById('loading-timeout-action');
            if (timeoutAction && document.getElementById('gfc-loader')) {
                timeoutAction.style.display = 'block';
            }
        }, 10000);

        // Core Handshaking Helpers
        window.getCookie = function(n){let m=document.cookie.match(new RegExp("(?:^|; )"+n.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g,'\\$1')+"=([^;]*)"));return m?decodeURIComponent(m[1]):null;};
        window.setCookie = function(n,v,d){var e="";if(d){var t=new Date();t.setTime(t.getTime()+(d*24*60*60*1000));e="; expires="+t.toUTCString();}var s=location.protocol==='https:'?"; Secure":"";document.cookie=n+"="+(v||"")+e+"; path=/; SameSite=Lax"+s;};

        // Storage Worker Bridge
        let gfcWorker = null;
        const pendingRequests = new Map();

        try {
            gfcWorker = new Worker('gfc-storage-worker.js?v=92');
            gfcWorker.onmessage = (e) => {
                const { action, key, value } = e.data;
                const resolver = pendingRequests.get(action === "getAll_result" ? "getAll" : (action + "_" + key));
                if (resolver) { pendingRequests.delete(action === "getAll_result" ? "getAll" : (action + "_" + key)); resolver(value); }
            };
        } catch (e) { console.warn("Worker Init Failed:", e); }

        window.gfcGetAsync = (key) => new Promise(res => {
            if (!gfcWorker) return res(null);
            const t = setTimeout(() => { pendingRequests.delete("get_result_" + key); res(null); }, 5000);
            pendingRequests.set("get_result_" + key, (v) => { clearTimeout(t); res(v); });
            gfcWorker.postMessage({ action: 'get', key });
        });

        window.gfcSetAsync = (key, value) => new Promise(res => {
            if (!gfcWorker) return res(false);
            const t = setTimeout(() => { pendingRequests.delete("set_result_" + key); res(false); }, 5000);
            pendingRequests.set("set_result_" + key, (v) => { clearTimeout(t); res(true); });
            gfcWorker.postMessage({ action: 'set', key, value });
        });

        window.getGfcItemAsync = async (key) => await window.gfcGetAsync(key);

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js?v=92').then(reg => {
                    console.log("[GFC SW] Registered:", reg.scope);
                }).catch(err => console.error("[GFC SW] Init Failed:", err));
            });

            // [UPDATE AUTO-RELOAD]
            // When a new service worker is activated (skipWaiting), reload the page to apply changes
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                console.log("[GFC SW] New version detected, reloading...");
                window.location.reload();
            });
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" async></script>
</body>
</html>
