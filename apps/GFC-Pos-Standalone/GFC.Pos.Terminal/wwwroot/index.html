<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <title>GFC POS Terminal</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="css/app.css?v=2.43.183" />
    <link rel="stylesheet" href="css/pos-terminal.css?v=2.43.183" />
    <link rel="stylesheet" href="css/pos-terminal-print.css?v=2.43.183" />
    <link href="_content/Blazored.Toast/blazored-toast.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="GFC.Pos.Terminal.styles.css?v=2.43.183" rel="stylesheet" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/connectivity.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // [FORCE-UPDATE] Bypass browser DLL cache on every new deployment
        const version = '2.43.183';
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                return `${defaultUri}?v=${version}`;
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script>
        // [OFFLINE-FIRST] Initialize LocalForage Vault
        localforage.config({
            name: 'GfcPosVault',
            storeName: 'PersistenceStore',
            description: 'Permanent storage for items, categories, and modifiers'
        });

        window.gfcSetAsync = async (key, value) => {
            try {
                await localforage.setItem(key, value);
                return true;
            } catch (err) {
                console.error("[VAULT] Save Error:", err);
                return false;
            }
        };
        
        window.gfcGetAsync = async (key) => {
            try {
                const val = await localforage.getItem(key);
                return typeof val === 'string' ? val : JSON.stringify(val);
            } catch (err) {
                console.warn("[VAULT] Load Error:", err);
                return null;
            }
        };
        
        window.gfcRemoveAsync = async (key) => {
            await localforage.removeItem(key);
        };

        // Atomically clears all shift log entries in a single pass.
        // Using a single JS call avoids the race condition where individual
        // gfcRemoveAsync interop calls are interrupted by a hard page reload.
        window.gfcClearShiftAsync = async (prefix) => {
            const keysToDelete = [];
            await localforage.iterate((value, key) => {
                if (key.startsWith(prefix)) keysToDelete.push(key);
            });
            for (const k of keysToDelete) {
                await localforage.removeItem(k);
            }
            return keysToDelete.length;
        };

        window.gfcGetAllAsync = async () => {
            const all = [];
            await localforage.iterate((value, key) => {
                all.push({ key, data: value });
            });
            return all;
        };

        window.gfcScrollToBottom = (id) => {
            const el = document.getElementById(id);
            if (el) el.scrollTop = el.scrollHeight;
        };

        // [CARD-SCANNER] Global High-Performance Listener
        // Optimized to only buffer rapid-fire input (typical of hardware scanners)
        let cardBuffer = "";
        let lastKeyTime = 0;
        window.GfcCardScanner = {
            initialize: (dotnetObj) => {
                window.addEventListener('keydown', (e) => {
                    const now = Date.now();
                    
                    // Hardware scanners type at < 50ms intervals. 
                    // Humans type at > 100ms. Increased to 250ms for tablet compatibility.
                    // If no input or textarea is focused, we increase the threshold to 2000ms
                    // to accommodate system startup/reload CPU lag that queues key events.
                    const isInputFocused = document.activeElement && 
                        (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA');
                    const timeoutThreshold = isInputFocused ? 250 : 2000;

                    if (cardBuffer.length > 0 && (now - lastKeyTime) > timeoutThreshold) {
                        cardBuffer = ""; 
                    }
                    
                    lastKeyTime = now;

                    if (e.key === 'Enter') {
                        if (cardBuffer.length >= 5) { 
                            e.preventDefault(); // Stop form submission or scrolling
                            console.log("[SCANNER] Card Detected:", cardBuffer.length, "digits");
                            dotnetObj.invokeMethodAsync('OnCardScanned', cardBuffer);
                        }
                        cardBuffer = "";
                    } else if (e.key.length === 1 && /[0-9]/.test(e.key)) {
                        cardBuffer += e.key;
                    }
                }, { passive: false });
            }
        };

        // [IDLE-TRACKER] Global Activity Listener
        window.GfcIdleTracker = {
            initialize: (dotnetObj) => {
                const reset = () => dotnetObj.invokeMethodAsync('ResetIdleTimer');
                ['mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt => 
                    window.addEventListener(evt, reset, { passive: true })
                );
            }
        };
    </script>
</body>

</html>
