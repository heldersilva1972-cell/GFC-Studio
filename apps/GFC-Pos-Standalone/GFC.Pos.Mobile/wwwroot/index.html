<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GFC.Pos.Mobile</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/GFC.Pos.UI/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="_content/GFC.Pos.UI/css/app.css" />
    <link rel="stylesheet" href="_content/GFC.Pos.UI/css/pos-terminal.css" />
    <link rel="stylesheet" href="_content/GFC.Pos.UI/css/pos-terminal-print.css" />
    <link href="_content/Blazored.Toast/blazored-toast.css" rel="stylesheet" />
    <link rel="stylesheet" href="GFC.Pos.Mobile.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/GFC.Pos.UI/js/connectivity.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        // [UI-THREAD OFFLOAD] Initialize Background Persistence Worker
        const gfcWorker = new Worker('_content/GFC.Pos.UI/gfc-storage-worker.js');
        const pendingRequests = new Map();

        gfcWorker.onmessage = (e) => {
            const { action, key, value } = e.data;
            if (action === "getAll_result") {
                const resolve = pendingRequests.get("getAll");
                if (resolve) {
                    pendingRequests.delete("getAll");
                    resolve(value);
                }
            } else if (action === "get_result") {
                const resolve = pendingRequests.get("get_" + key);
                if (resolve) {
                    pendingRequests.delete("get_" + key);
                    resolve(typeof value === "string" ? value : JSON.stringify(value));
                }
            } else if (action === "set_result") {
                const resolve = pendingRequests.get("set_" + key);
                if (resolve) {
                    pendingRequests.delete("set_" + key);
                    resolve(true);
                }
            } else if (action === "clearPrefix_result") {
                const resolve = pendingRequests.get("clearPrefix_" + key);
                if (resolve) {
                    pendingRequests.delete("clearPrefix_" + key);
                    resolve(e.data.count || 0);
                }
            }
        };

        window.gfcSetAsync = (key, value) => new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                pendingRequests.delete("set_" + key);
                reject("gfcSetAsync Timeout");
            }, 5000);
            pendingRequests.set("set_" + key, (val) => { clearTimeout(timeout); resolve(val); });
            gfcWorker.postMessage({ action: 'set', key, value });
        });
        
        window.gfcGetAsync = (key) => new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                pendingRequests.delete("get_" + key);
                resolve(null); 
            }, 5000);
            pendingRequests.set("get_" + key, (val) => { clearTimeout(timeout); resolve(val); });
            gfcWorker.postMessage({ action: 'get', key });
        });
        
        window.gfcGetAllAsync = () => new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
                pendingRequests.delete("getAll");
                resolve("[]");
            }, 10000);
            pendingRequests.set("getAll", (val) => { clearTimeout(timeout); resolve(val); });
            gfcWorker.postMessage({ action: 'getAll' });
        });

        window.gfcRemoveAsync = (key) => {
            gfcWorker.postMessage({ action: 'remove', key });
        };

        window.gfcClearShiftAsync = (prefix) => new Promise((resolve) => {
            const timeout = setTimeout(() => {
                pendingRequests.delete("clearPrefix_" + prefix);
                resolve(0);
            }, 5000);
            pendingRequests.set("clearPrefix_" + prefix, (val) => { clearTimeout(timeout); resolve(val); });
            gfcWorker.postMessage({ action: 'clearPrefix', key: prefix, value: prefix });
        });

        window.gfcScrollToBottom = (id) => {
            const el = document.getElementById(id);
            if (el) el.scrollTop = el.scrollHeight;
        };

        // [CARD-SCANNER] Global High-Performance Listener
        let cardBuffer = "";
        let lastKeyTime = 0;
        window.GfcCardScanner = {
            initialize: (dotnetObj) => {
                window.addEventListener('keydown', (e) => {
                    const now = Date.now();
                    
                    // Hardware scanners type at < 50ms intervals. 
                    // Humans type at > 100ms. Increased to 250ms for tablet compatibility.
                    // If no input or textarea is focused, we increase the threshold to 2000ms
                    // to accommodate system startup/reload CPU lag that queues key events.
                    const isInputFocused = document.activeElement && 
                        (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA');
                    const timeoutThreshold = isInputFocused ? 250 : 2000;

                    if (cardBuffer.length > 0 && (now - lastKeyTime) > timeoutThreshold) {
                        cardBuffer = ""; 
                    }
                    
                    lastKeyTime = now;

                    if (e.key === 'Enter') {
                        if (cardBuffer.length >= 5) { 
                            e.preventDefault();
                            console.log("[SCANNER] Card Detected:", cardBuffer.length, "digits");
                            dotnetObj.invokeMethodAsync('OnCardScanned', cardBuffer);
                        }
                        cardBuffer = "";
                    } else if (e.key.length === 1 && /[0-9]/.test(e.key)) {
                        cardBuffer += e.key;
                    }
                }, { passive: false });
            }
        };

        // [IDLE-TRACKER] Global Activity Listener
        window.GfcIdleTracker = {
            initialize: (dotnetObj) => {
                const reset = () => dotnetObj.invokeMethodAsync('ResetIdleTimer');
                ['mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt => 
                    window.addEventListener(evt, reset, { passive: true })
                );
            }
        };
    </script>

</body>

</html>
